name = "youtubekit-server"
main = "src/worker.js"
compatibility_date = "2025-05-03"

# The quickjs signature solver is no longer used: none of the clients this worker
# talks to return ciphered URLs, so there is nothing to solve. src/index.ts and the
# TypeScript sources are left in place for reference.

# Limit CPU execution [in milliseconds]
[limits]
cpu_ms = 5000

[observability]
enabled = true

# [placement]
# mode = "smart"

# Variables will be loaded from .dev.vars for local development
[vars]




# Production environment --------------------------------------------------------

[env.production]
name = "youtubekit-server-production"

[[routes]]
pattern = "fallback.trending.fm"
custom_domain = true
